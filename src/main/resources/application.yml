spring:
  application:
    name: study
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
  # Cấu hình Flyway
  flyway:
    enabled: true                   # Bật Flyway tự động chạy migration khi khởi động app
    baseline-on-migrate: false      # Đặt true nếu database của bạn đã có sẵn bảng từ trước
    locations: classpath:db/migration # Đường dẫn chứa các file script migration (.sql)
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen2.5:3b
          temperature: 0.7


server:
  port: 8080

